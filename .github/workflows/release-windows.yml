name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@12.6.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Package installer
        run: pnpm --filter @hermes-hub/desktop exec electron-builder --win nsis --x64 --publish never
      - name: Publish GitHub release assets
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title "Hermes Hub $tag" --notes "Hermes Hub $tag"
          }
          $assets = Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|blockmap|yml)$' }
          if ($assets.Count -lt 3) { throw "Expected installer, blockmap, and latest.yml; found $($assets.Count) assets." }
          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($asset.Name)" }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
