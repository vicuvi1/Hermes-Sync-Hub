name: Feature request
description: Suggest a focused product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: User problem, description: What is difficult today and who is affected? }
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes: { label: Desired outcome, description: Describe success without prescribing implementation. }
    validations: { required: true }
  - type: textarea
    id: safety
    attributes: { label: Privacy, recovery, or synchronization risks }
